<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" fill="none" width="100%" height="100%">
    <defs>
        <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f8fafc"/>
            <stop offset="100%" stop-color="#edf2f7"/>
        </linearGradient>
        <linearGradient id="phoneBody" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1e293b"/>
            <stop offset="100%" stop-color="#0f172a"/>
        </linearGradient>
        <filter id="phoneShadow" x="-15%" y="-15%" width="130%" height="130%" filterUnits="userSpaceOnUse">
            <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
        </filter>
        <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.1"/>
        </filter>
    </defs>

    <!-- Canvas Background -->
    <rect width="400" height="200" fill="url(#bg2)"/>

    <!-- Subtle Background Grid -->
    <g stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 4" opacity="0.6">
        <line x1="40" y1="0" x2="40" y2="200"/>
        <line x1="120" y1="0" x2="120" y2="200"/>
        <line x1="200" y1="0" x2="200" y2="200"/>
        <line x1="280" y1="0" x2="280" y2="200"/>
        <line x1="360" y1="0" x2="360" y2="200"/>
        <line x1="0" y1="50" x2="400" y2="50"/>
        <line x1="0" y1="100" x2="400" y2="100"/>
        <line x1="0" y1="150" x2="400" y2="150"/>
    </g>

    <!-- Center Composition: Mobile Smartphone with Chat Bubbles -->
    <g transform="translate(135, 10)">
        <!-- Phone Outer Body -->
        <g filter="url(#phoneShadow)">
            <rect x="0" y="0" width="130" height="180" rx="20" fill="url(#phoneBody)"/>
            <!-- Phone Glass Screen -->
            <rect x="6" y="8" width="118" height="164" rx="14" fill="#ffffff"/>
            <!-- Dynamic Island / Speaker Notch -->
            <rect x="45" y="12" width="40" height="5" rx="2.5" fill="#0f172a"/>
        </g>

        <!-- App Bar inside screen -->
        <rect x="6" y="8" width="118" height="24" rx="14" fill="#f8fafc"/>
        <circle cx="20" cy="22" r="5" fill="#cbd5e1"/>
        <rect x="30" y="19" width="36" height="4" rx="2" fill="#475569"/>
        <circle cx="112" cy="22" r="2" fill="#22c55e"/> <!-- Online status indicator -->

        <!-- Incoming Chat Bubble 1 (Suspicious message) -->
        <g transform="translate(14, 40)">
            <rect x="0" y="0" width="92" height="34" rx="8" fill="#f1f5f9"/>
            <path d="M-4 10 L0 6 L0 14 Z" fill="#f1f5f9"/>
            <rect x="8" y="8" width="60" height="4" rx="2" fill="#dc2626"/>
            <rect x="8" y="16" width="76" height="4" rx="2" fill="#64748b"/>
            <rect x="8" y="23" width="44" height="4" rx="2" fill="#94a3b8"/>
        </g>

        <!-- Dilemma Options Prompt -->
        <g transform="translate(14, 84)">
            <!-- Option A (Risky) -->
            <rect x="0" y="0" width="102" height="18" rx="6" fill="#fff1f2" stroke="#fecdd3" stroke-width="1"/>
            <circle cx="8" cy="9" r="3" fill="#f43f5e"/>
            <rect x="16" y="7" width="55" height="4" rx="2" fill="#881337"/>

            <!-- Option B (Safest - Selected) -->
            <rect x="0" y="24" width="102" height="20" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
            <circle cx="8" cy="34" r="4" fill="#22c55e"/>
            <path d="M6 34 L8 36 L11 32" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
            <rect x="16" y="31" width="68" height="4" rx="2" fill="#14532d"/>
            <rect x="16" y="37" width="45" height="3" rx="1.5" fill="#16a34a"/>

            <!-- Option C -->
            <rect x="0" y="50" width="102" height="18" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
            <circle cx="8" cy="59" r="3" fill="#cbd5e1"/>
            <rect x="16" y="57" width="50" height="4" rx="2" fill="#64748b"/>
        </g>
    </g>

    <!-- Side Floating Badge: Shield with Check -->
    <g transform="translate(62, 55)" filter="url(#badgeShadow)">
        <circle cx="28" cy="28" r="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
        <path d="M28 14 L39 18 V29 C39 37 34 42 28 44 C22 42 17 37 17 29 V18 Z" fill="#0f172a"/>
        <path d="M24 29 L27 32 L33 25" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Side Floating Chat Bubble (Right) -->
    <g transform="translate(285, 75)" filter="url(#badgeShadow)">
        <rect x="0" y="0" width="56" height="38" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
        <path d="M12 38 L8 46 L20 38 Z" fill="#ffffff"/>
        <circle cx="18" cy="19" r="3" fill="#0f172a"/>
        <circle cx="28" cy="19" r="3" fill="#0f172a"/>
        <circle cx="38" cy="19" r="3" fill="#0f172a"/>
    </g>
</svg>
