<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Case 1 · Email Check</title>
    <link rel="icon" href="assets/images/logo.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#243f6b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Spot the Scam">
    <link rel="apple-touch-icon" href="assets/images/icon-192.png">
    <link rel="stylesheet" href="css/case1.css?v=7">
</head>
<body>
    <a class="skip" href="#main">Skip to content</a>
    <input class="menu-toggle" type="checkbox" id="menu-toggle">
    <header class="site-header">
        <a class="logo" href="index.html">
            <img src="assets/images/logo.svg" alt="" width="48" height="48">
            <span>Spot the Scam</span>
        </a>
        <label class="menu-btn" for="menu-toggle">
            <span class="menu-bars" aria-hidden="true"></span>
            <span class="sr">Menu</span>
        </label>
        <div class="header-tools">
        <nav aria-label="Main">
                <a href="case1.html" aria-current="page">Case 1</a>
                <a href="case2.html">Case 2</a>
                <a href="case3.html">Case 3</a>
                <a href="training.html">Training</a>
                <a href="index.html?pane=badges">Badges</a>
            </nav>
            <div class="install-wrap">
                <button type="button" class="btn btn-quiet" id="install-btn" hidden>Install app</button>
                <p class="install-note" id="install-note" hidden></p>
            </div>
        </div>
    </header>
    <label class="menu-backdrop" for="menu-toggle"></label>

    <main id="main">
        <div class="page-head">
            <p class="kicker">Case 1</p>
            <h1>Email Check</h1>
            <p class="how-to">Read the email. Is it a scam or a real message? <span class="goal">Goal: 15 of 20</span></p>
        </div>
        <div class="progress-box">
            <p id="progress-label">Email 1 of 20</p>
            <p id="score-label">Score: 0</p>
            <div class="bar" aria-hidden="true"><span id="score-bar"></span></div>
        </div>

        <section id="play-panel" class="play-grid">
            <div class="evidence">
                <p class="evidence-title">The email</p>
                <article class="email-card">
                    <p><span class="email-label">From</span> <span id="email-from"></span></p>
                    <p><span class="email-label">Subject</span> <span id="email-subject"></span></p>
                    <p id="email-message" class="email-body"></p>
                </article>
                <p id="category-label" class="topic"></p>
            </div>

            <div class="decisions">
                <div class="question-block">
                    <h2><span class="step-tag">Step 1</span> Is this email a scam?</h2>
                    <div class="choice-row pair">
                        <button type="button" id="choose-scam" class="choice-btn" data-base-class="choice-btn">
                            <span class="choice-icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 21h20L12 3z"/><path d="M12 10v5"/><path d="M12 18.5h.01"/></svg>
                            </span>
                            <span class="choice-label">Scam</span>
                            <span class="choice-help">Fake. Someone is trying to trick me.</span>
                            <span class="choice-note"></span>
                        </button>
                        <button type="button" id="choose-legit" class="choice-btn" data-base-class="choice-btn">
                            <span class="choice-icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 6v6c0 4.5 3.4 8 8 9 4.6-1 8-4.5 8-9V6l-8-3z"/><path d="m9 12 2 2 4-4"/></svg>
                            </span>
                            <span class="choice-label">Legitimate</span>
                            <span class="choice-help">Real. This message is safe.</span>
                            <span class="choice-note"></span>
                        </button>
                    </div>
                </div>
                <div id="feedback" class="feedback" aria-live="polite"></div>

                <section id="clue-box" class="question-block" hidden>
                    <h2><span class="step-tag">Step 2</span> What is the main clue?</h2>
                    <div class="choice-row">
                        <button type="button" class="choice-btn clue-btn" data-base-class="choice-btn clue-btn" data-clue="Fake Sender">
                            <span class="choice-label">Fake Sender</span>
                            <span class="choice-help">The email address or name looks wrong.</span>
                            <span class="choice-note"></span>
                        </button>
                        <button type="button" class="choice-btn clue-btn" data-base-class="choice-btn clue-btn" data-clue="Fake Urgency">
                            <span class="choice-label">Fake Urgency</span>
                            <span class="choice-help">It says hurry, act now, or you will lose something.</span>
                            <span class="choice-note"></span>
                        </button>
                        <button type="button" class="choice-btn clue-btn" data-base-class="choice-btn clue-btn" data-clue="Information Requests">
                            <span class="choice-label">Information Requests</span>
                            <span class="choice-help">It asks for a password, code, or private details.</span>
                            <span class="choice-note"></span>
                        </button>
                        <button type="button" class="choice-btn clue-btn" data-base-class="choice-btn clue-btn" data-clue="No warning sign">
                            <span class="choice-label">No warning sign</span>
                            <span class="choice-help">Nothing suspicious. This message is real.</span>
                            <span class="choice-note"></span>
                        </button>
                    </div>
                </section>
                <div id="clue-feedback" class="feedback" aria-live="polite"></div>

                <div class="next-bar">
                    <button type="button" class="btn" id="next-btn" hidden>Next</button>
                </div>
            </div>
        </section>
    </main>

    <script src="js/questions.js"></script>
    <script src="js/app.js?v=9"></script>
    <script src="js/case1.js"></script>
    <script src="js/install.js"></script>
</body>
</html>
