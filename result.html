<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Result · Spot the Scam</title>
    <link rel="icon" href="assets/images/logo.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#243f6b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Spot the Scam">
    <link rel="apple-touch-icon" href="assets/images/icon-192.png">
    <link rel="stylesheet" href="css/result.css?v=6">
</head>
<body>
    <a class="skip" href="#main">Skip to content</a>
    <input class="menu-toggle" type="checkbox" id="menu-toggle">
    <header class="site-header">
        <a class="logo" href="index.html">
            <img src="assets/images/logo.svg" alt="" width="48" height="48">
            <span>Spot the Scam</span>
        </a>
        <label class="menu-btn" for="menu-toggle">
            <span class="menu-bars" aria-hidden="true"></span>
            <span class="sr">Menu</span>
        </label>
        <div class="header-tools">
        <nav aria-label="Main">
                <a href="case1.html">Case 1</a>
                <a href="case2.html">Case 2</a>
                <a href="case3.html">Case 3</a>
                <a href="training.html">Training</a>
                <a href="index.html?pane=badges">Badges</a>
            </nav>
            <div class="install-wrap">
                <button type="button" class="btn btn-quiet" id="install-btn" hidden>Install app</button>
                <p class="install-note" id="install-note" hidden></p>
            </div>
        </div>
    </header>
    <label class="menu-backdrop" for="menu-toggle"></label>

    <main id="main">
        <section id="empty-result" class="panel" hidden>
            <h1>No result yet</h1>
            <p>Finish a case to see a score here.</p>
            <a class="btn" href="index.html">Back to Home</a>
        </section>

        <section id="result-panel" hidden>
            <div class="page-head">
                <p class="kicker">Your result</p>
                <h1 id="result-title">Result</h1>
            </div>
            <div class="result-card">
                <div class="score-ring">
                    <p class="score-big" id="result-score">0 / 0</p>
                </div>
                <div class="result-words">
                    <p class="status-row"><span class="pill" id="result-status">Result</span></p>
                    <p id="result-pass">Pass mark</p>
                    <p id="result-message" class="lead"></p>
                    <ul id="practice-list" class="practice-list"></ul>
                    <p id="result-note"></p>
                </div>
                <div class="button-row">
                    <a class="btn btn-teal" id="next-btn" href="index.html" hidden>Next</a>
                    <a class="btn" id="retry-btn" href="index.html">Retry Case</a>
                    <button type="button" class="btn btn-quiet" id="review-btn">See my answers</button>
                    <a class="btn btn-quiet" href="index.html">Back to Home</a>
                </div>
            </div>
            <section id="review-box" hidden>
                <h2>My answers</h2>
                <div id="review-list"></div>
            </section>
        </section>
    </main>

    <script src="js/app.js?v=9"></script>
    <script src="js/result.js"></script>
    <script src="js/install.js"></script>
</body>
</html>
